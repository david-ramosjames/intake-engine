# Local Postgres for development. Start with:  docker compose up -d
# Then set in .env:
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/intake_engine?schema=public"
# and run:  npm run db:migrate && npm run db:seed

services:
  postgres:
    image: postgres:16
    container_name: intake-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intake_engine
    ports:
      - "5432:5432"
    volumes:
      - intake_engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  intake_engine_pgdata:
